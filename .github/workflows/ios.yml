name: iOS (IPA para Sideloadly)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto e compilar (sem assinatura)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Figurinhas.xcodeproj -target Figurinhas -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Release-iphoneos/Figurinhas.app Payload/
          zip -qry Figurinhas.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Figurinhas-ipa
          path: ios/Figurinhas.ipa

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${{ github.run_number }}"
          gh release create "$TAG" ios/Figurinhas.ipa --title "Figurinhas iOS #${{ github.run_number }}" \
            --notes "Instale com o Sideloadly (Windows) usando seu Apple ID. Reassinar a cada 7 dias." --latest
